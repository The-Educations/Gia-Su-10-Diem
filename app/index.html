<!doctype html>

    <meta
      name="description"
      content="Tìm gia sư theo môn học, cấp học và mục tiêu kỳ thi. Đặt lịch và trao đổi cùng gia sư."
    />
    <title>Gia Sư 10 Điểm · Tìm gia sư</title>
    <style>
      @property --boot-hole { syntax: "<length>"; inherits: false; initial-value: 0px; }
      #boot {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background: #faf8f3; pointer-events: none;
        -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent var(--boot-hole), #000 calc(var(--boot-hole) + 1px));
        mask-image: radial-gradient(circle at 50% 50%, transparent var(--boot-hole), #000 calc(var(--boot-hole) + 1px));
        animation: boot-safety 0s 4s forwards;
      }
      #boot[data-done] { animation: boot-open 260ms cubic-bezier(.7, 0, .2, 1) forwards; }
      .boot-art { width: min(70vw, 340px); overflow: visible; }
      .boot-art path, .boot-art rect, .boot-art circle { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .boot-one, .boot-zero { stroke: #282820; stroke-width: 10; stroke-dasharray: 1; stroke-dashoffset: 1; }
      .boot-one { animation: boot-draw 140ms cubic-bezier(.4, 0, .2, 1) forwards; }
      .boot-zero { animation: boot-draw 220ms 100ms cubic-bezier(.4, 0, .2, 1) forwards; }
      .boot-ring { stroke: #852f36; stroke-width: 7; stroke-dasharray: 1; stroke-dashoffset: 1; animation: boot-draw 280ms 280ms cubic-bezier(.3, 0, .1, 1) forwards; }
      .boot-d { font: 600 58px "Lora", Georgia, serif; fill: #852f36; transform-box: fill-box; transform-origin: center; opacity: 0; animation: boot-stamp 200ms 520ms cubic-bezier(.2, 1.6, .4, 1) forwards; }
      .boot-bits > * { transform: translate(120px, 120px) scale(0); fill: #852f36; stroke: none; opacity: 0; animation: boot-burst 320ms 560ms cubic-bezier(.16, 1, .3, 1) forwards; }
      .boot-bits > :nth-child(even) { fill: #c99a3c; }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-stamp { from { opacity: 0; transform: scale(1.8) rotate(-14deg); } to { opacity: 1; transform: scale(1) rotate(-6deg); } }
      @keyframes boot-burst {
        60% { opacity: 1; }
        to { opacity: 0; transform: translate(calc(120px + var(--x)), calc(120px + var(--y))) rotate(var(--r, 0deg)) scale(1.7); }
      }
      @keyframes boot-open { from { --boot-hole: 0px; } to { --boot-hole: 75vmax; opacity: 0; } }
      @keyframes boot-safety { to { visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        .boot-one, .boot-zero, .boot-ring { animation: none; stroke-dashoffset: 0; }
        .boot-d { animation: none; opacity: 1; transform: rotate(-6deg); }
        .boot-bits { display: none; }
        #boot[data-done] { animation: boot-fade 200ms ease-out forwards; }
        @keyframes boot-fade { to { opacity: 0; } }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <svg class="boot-art" viewBox="0 0 240 240">
        <g class="boot-bits">
          <path style="--x:-86px;--y:-58px;--r:-40deg" d="M0-6 1.8-1.8 6 0 1.8 1.8 0 6-1.8 1.8-6 0-1.8-1.8Z" />
          <rect style="--x:92px;--y:-40px;--r:30deg" x="-4" y="-2.5" width="8" height="5" rx="1" />
          <path style="--x:78px;--y:70px;--r:60deg" d="M0-5 1.5-1.5 5 0 1.5 1.5 0 5-1.5 1.5-5 0-1.5-1.5Z" />
          <rect style="--x:-70px;--y:76px;--r:-20deg" x="-3.5" y="-2" width="7" height="4" rx="1" />
          <circle style="--x:-100px;--y:10px" r="2.6" />
          <circle style="--x:104px;--y:18px" r="2.2" />
        </g>
        <path class="boot-one" pathLength="1" d="M90 86 106 72v88" />
        <path class="boot-zero" pathLength="1" d="M152 72c-21 0-29 25-29 44 0 24 10 44 29 44s27-23 27-45c0-21-8-43-27-43" />
        <path class="boot-ring" pathLength="1" d="M60 122c-1-49 48-71 90-67 46 5 60 41 55 71-6 40-51 60-93 54-38-6-60-30-52-64 4-18 16-30 32-38" />
        <text class="boot-d" x="192" y="84">đ</text>
      </svg>
    </div>
    <script>
      if (navigator.webdriver) document.getElementById("boot").remove();
      else window.__bootAt = performance.now();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
