name: Inspect Cloudflare build

# Manual diagnostics for the native Workers Builds connection; never deploys the app.
on:
  workflow_dispatch:
    inputs:
      cloudflare_build_id:
        description: Optional failed Cloudflare build UUID to inspect
        type: string
      repair_cloudflare_builds:
        description: Apply CI-gated production settings
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  inspect-builds:
    name: Inspect native Cloudflare build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the production branch matches validated main before reconfiguration
        if: inputs.repair_cloudflare_builds
        uses: actions/github-script@v7
        with:
          script: |
            const main = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            const production = await github.rest.repos.getBranch({...context.repo, branch: 'cloudflare-production'});
            if (main.data.commit.sha !== production.data.commit.sha) throw new Error('Promote validated main before changing the production branch.');
            const runs = await github.paginate(github.rest.checks.listForRef, {...context.repo, ref: main.data.commit.sha, check_name: 'Validate'});
            if (!runs.some(run => run.app?.slug === 'github-actions' && run.conclusion === 'success')) throw new Error('Main must pass Validate before reconfiguration.');
      - run: node scripts/inspect-cloudflare-builds.mjs
        env:
          CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
          CLOUDFLARE_BUILD_ID: ${{ inputs.cloudflare_build_id }}
          REPAIR_CLOUDFLARE_BUILDS: ${{ inputs.repair_cloudflare_builds }}

