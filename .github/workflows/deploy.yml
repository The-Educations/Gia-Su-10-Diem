name: Deploy

# Main: one quick gate on the merged commit, then Cloudflare. Browser journeys already ran
# on the pull request for this exact tree.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test API, authorization and Google OAuth
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build the production site
        run: npm run build:cloudflare
      - name: Validate the Worker bundle and bindings
        run: npx wrangler deploy --dry-run
      - name: Check Cloudflare runtime
        shell: bash
        run: |
          npx wrangler dev --port 4176 --var APP_ORIGIN:http://127.0.0.1:4176 --var MAILFLARE_URL:http://127.0.0.1:4180 --var MAILFLARE_API_KEY:runtime-test-only --var MAILFLARE_MAILBOX_ID:mailbox-test > "$RUNNER_TEMP/worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          for _ in {1..30}; do
            curl --fail --silent --max-time 2 http://127.0.0.1:4176/api/health > /dev/null && break
            sleep 2
          done
          curl --fail --silent --max-time 2 http://127.0.0.1:4176/api/health > /dev/null || { cat "$RUNNER_TEMP/worker.log"; exit 1; }
          npm run test:cloudflare
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist/site
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy Cloudflare
    needs: validate
    if: github.repository == 'The-Educations/Gia-Su-10-Diem' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      checks: read
    environment:
      name: production
      url: https://giasudiem10.online
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Skip revisions superseded on main
        id: revision
        shell: bash
        run: |
          latest="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment because main has a newer revision."
            echo "Deployment skipped: main has a newer revision." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: steps.revision.outputs.current == 'true'
      - uses: actions/download-artifact@v4
        if: steps.revision.outputs.current == 'true'
        with:
          name: site-${{ github.sha }}
          path: dist/site
      - name: Deploy the verified build
        if: steps.revision.outputs.current == 'true' && vars.CLOUDFLARE_NATIVE_BUILDS != 'true'
        shell: bash
        # A dropped connection to Cloudflare is retried; a real error fails all three tries.
        run: |
          for attempt in 1 2 3; do
            npx wrangler deploy --durable-objects-code-update-mode immediate --var GIT_COMMIT:$GITHUB_SHA --var DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ) && exit 0
            echo "::warning::wrangler deploy attempt $attempt failed"
            sleep $((attempt * 15))
          done
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Promote the verified commit and wait for Cloudflare
        if: steps.revision.outputs.current == 'true' && vars.CLOUDFLARE_NATIVE_BUILDS == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { promote, waitForBuild } = require('./scripts/cloudflare-build.cjs');
            const afterCheckId = await promote(github, context);
            const buildUrl = await waitForBuild(github, context, {afterCheckId});
            await core.summary.addLink('Workers Builds: giasu-diem10', buildUrl).write();
      - name: Verify production
        if: steps.revision.outputs.current == 'true'
        run: node test/production-routing.mjs
      - name: Link the verified live site
        if: steps.revision.outputs.current == 'true'
        run: echo 'Production checks passed — [Open Gia-Sư 10 Điểm](https://giasudiem10.online)' >> "$GITHUB_STEP_SUMMARY"
