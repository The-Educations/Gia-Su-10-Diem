name: CI

# Pull requests: everything a merge needs. Branch protection requires "Validate" and an
# up-to-date branch, so the commit that lands on main is the one tested here.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: API, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check TypeScript
        run: npm run typecheck
      - name: Test API, authorization and Google OAuth
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build the production site
        run: npm run build:cloudflare
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist/site
          if-no-files-found: error
          retention-days: 7

  # Pull requests only: branch protection requires them to be up to date with main,
  # so the commit that lands on main is the one these journeys already passed.
  browser:
    name: Browser journeys (${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist/site
      - name: Serve the built app in the browser tests
        run: |
          cp -R dist/site/app dist/app
          cp -R dist/site/legal dist/legal
      - name: Use the runner's Chrome, install it only when missing
        run: command -v google-chrome || npx playwright install --with-deps chrome
      - name: Test student, tutor and admin journeys
        run: npx playwright test --shard=${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ github.sha }}-${{ strategy.job-index }}
          path: test-results
          retention-days: 7

  worker:
    name: Cloudflare runtime
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist/site
      - name: Validate the Worker bundle and bindings
        run: npx wrangler deploy --dry-run
      - name: Check Cloudflare runtime
        shell: bash
        run: |
          npx wrangler dev --port 4176 --var APP_ORIGIN:http://127.0.0.1:4176 --var MAILFLARE_URL:http://127.0.0.1:4180 --var MAILFLARE_API_KEY:runtime-test-only --var MAILFLARE_MAILBOX_ID:mailbox-test > "$RUNNER_TEMP/worker.log" 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4176/api/health > /dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/worker.log"
            exit 1
          fi
          npm run test:cloudflare
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cloudflare-failures-${{ github.sha }}
          path: ${{ runner.temp }}/worker.log
          retention-days: 7

  checks:
    name: Validate
    if: always()
    needs: [build, browser, worker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do test "$r" = success; done
